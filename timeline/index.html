<script>
    document.addEventListener('DOMContentLoaded', function() {
      
      // ========== 1. 加载动画（3秒后消失） ==========
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 800); // 等淡出动画结束
      }, 3000); // 强制显示3秒

      // ========== 2. 明暗模式切换（水波荡漾） ==========
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function(e) {
          const x = e.clientX;
          const y = e.clientY;
          const ripple = document.createElement('div');
          ripple.className = 'theme-ripple';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';
          
          const maxRadius = Math.hypot(window.innerWidth, window.innerHeight);
          ripple.style.width = ripple.style.height = maxRadius * 2 + 'px';
          
          document.body.appendChild(ripple);

          requestAnimationFrame(() => {
            ripple.style.transform = 'translate(-50%, -50%) scale(1)';
          });

          setTimeout(() => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggle.textContent = isLight ? '☀️' : '🌙';
            ripple.remove();
          }, 800);
        });
      }

      // ========== 3. 关于页面：滚动切换九宫格角色 ==========
      const panels = document.querySelectorAll('.character-panel');
      if (panels.length > 0) {
        const circle = document.getElementById('character-visual');
        const numberEl = document.getElementById('character-number');
        
        // ⚠️ 你以后画好角色图，就把这里的渐变替换成图片路径，比如 ['/images/char1.png', ...]
        const styles = [
          'linear-gradient(135deg, #667eea, #764ba2)',
          'linear-gradient(135deg, #f093fb, #f5576c)',
          'linear-gradient(135deg, #4facfe, #00f2fe)',
          'linear-gradient(135deg, #43e97b, #38f9d7)',
          'linear-gradient(135deg, #fa709a, #fee140)',
          'linear-gradient(135deg, #a18cd1, #fbc2eb)',
          'linear-gradient(135deg, #ffecd2, #fcb69f)',
          'linear-gradient(135deg, #ff9a9e, #fecfef)',
          'linear-gradient(135deg, #a1c4fd, #c2e9fb)'
        ];

        let currentIndex = 0;

        function switchCharacter(index) {
          if (index === currentIndex) return;
          
          circle.style.transform = 'scale(0.8)';
          circle.style.opacity = '0.3';

          setTimeout(() => {
            circle.style.background = styles[index % styles.length];
            if (numberEl) numberEl.textContent = String(index + 1).padStart(2, '0');
            circle.style.transform = 'scale(1)';
            circle.style.opacity = '1';
            currentIndex = index;
          }, 300);
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const index = parseInt(entry.target.getAttribute('data-index')) - 1;
              panels.forEach(p => p.classList.remove('active'));
              entry.target.classList.add('active');
              switchCharacter(index);
            }
          });
        }, { threshold: 0.5 });

        panels.forEach(panel => observer.observe(panel));
      }
      
    });
  </script>
